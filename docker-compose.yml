services:
  db:
    image: mysql:8.0
    container_name: empresa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: 'empresa_core'
    ports:
      - "3307:3306"  # Puerto 3307 en tu máquina para no chocar con MySQL local
    volumes:
      - ./empresa_core_DB.sql:/docker-entrypoint-initdb.d/empresa_core_DB.sql
    networks:
      - intranet_network

  api:
    build:
      context: ./servidor api
    container_name: empresa_api
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db           # Nombre del servicio de la BBDD dentro de Docker
      - DB_PORT=3306         # Puerto interno de Docker (siempre 3306 entre contenedores)
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=empresa_core
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - intranet_network

networks:
  intranet_network:
    driver: bridge
