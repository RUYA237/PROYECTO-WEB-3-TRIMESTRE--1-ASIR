services:
  db:
    image: mysql:8.0
    container_name: empresa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: 'empresa_core'
    ports:
      - "3307:3306"
    volumes:
      - ./empresa_core_DB.sql:/docker-entrypoint-initdb.d/empresa_core_DB.sql
    networks:
      - intranet_network

  api:
    build:
      context: ./api        # ← ESTO ES LO QUE ESTABA MAL (ponía ./servidor api)
    container_name: empresa_api
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=empresa_core
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - intranet_network

  web:
    image: nginx:alpine       # ← ESTE SERVICIO FALTABA (sirve tu HTML)
    container_name: empresa_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./js:/usr/share/nginx/html/js
      - ./styles:/usr/share/nginx/html/styles
      - ./routes:/usr/share/nginx/html/routes
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - intranet_network

networks:
  intranet_network:
    driver: bridge