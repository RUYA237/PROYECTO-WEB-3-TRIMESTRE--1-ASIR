<div id="page-directorio" class="page">
  <div class="page-header">
    <h1>Directorio</h1>
    <p>Busca empleados por nombre, cargo o departamento</p>
  </div>

  <div class="search-bar">
    <input type="text" id="buscar" placeholder="Buscar..." oninput="filtrarEmpleados()" />
    <select id="filtro-depto" onchange="filtrarEmpleados()">
      <option value="">Todos los departamentos</option>
    </select>
    <select id="filtro-estado" onchange="filtrarEmpleados()">
      <option value="">Todos</option>
      <option value="Activo">Activo</option>
      <option value="Inactivo">Inactivo</option>
    </select>
  </div>

  <div class="emp-grid" id="emp-grid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Cargando...</div>
  </div>
</div>
