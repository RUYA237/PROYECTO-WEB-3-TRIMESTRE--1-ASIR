<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Tech · Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body class="login">

  <div class="login-box">
    <div class="login-logo">
      <h1>Nexora Tech</h1>
      <p>Sistema de Gestión Interna</p>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="cgomez" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••" autocomplete="current-password" />
    </div>
    <p id="login-error">Usuario o contraseña incorrectos.</p>
    <button class="btn btn-blue" id="btn-entrar" onclick="doLogin()">Entrar</button>
    <p class="login-hint">
      Ejemplo: <span>cgomez</span> / <span>hash_auto_1</span>
    </p>
  </div>
</body>
</html>
