<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Tech · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body class="login">
  <div class="login-box">
    <div class="login-logo">
      <h1>Nexora Tech</h1>
      <p>Sistema de Gestión Interna</p>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="cgomez" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password" />
    </div>
    <p id="login-error"></p>
    <button class="btn btn-blue" id="btn-login" onclick="doLogin()">Entrar</button>
    <p class="login-hint">Usa las credenciales de la base de datos</p>
  </div>

  <script>
    var API_URL = "http://localhost:3000";

    document.getElementById("login-pass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      var username = document.getElementById("login-user").value.trim();
      var password = document.getElementById("login-pass").value;
      var errEl    = document.getElementById("login-error");
      var btn      = document.getElementById("btn-login");

      errEl.style.display = "none";

      if (!username || !password) {
        errEl.textContent   = "Introduce usuario y contraseña.";
        errEl.style.display = "block";
        return;
      }

      btn.textContent = "Entrando...";
      btn.disabled    = true;

      try {
        var resp = await fetch(API_URL + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        var data = await resp.json();

        if (data.exito) {
          localStorage.setItem("nexora-user", data.datos.username);
          localStorage.setItem("nexora-rol",  data.datos.rol);
          localStorage.setItem("nexora-nombre", data.datos.nombre);
          window.location.href = "routes/dashboard.html";
        } else {
          errEl.textContent   = data.mensaje || "Credenciales incorrectas.";
          errEl.style.display = "block";
        }
      } catch(e) {
        errEl.textContent   = "No se puede conectar con el servidor (localhost:3000).";
        errEl.style.display = "block";
      } finally {
        btn.textContent = "Entrar";
        btn.disabled    = false;
      }
    }
  </script>
</body>
</html>
