<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Tech · Login</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body class="login">
  <div class="login-box">
    <div class="login-logo">
      <h1>Nexora Tech</h1>
      <p>Sistema de Gestión Interna</p>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="usuario" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password" />
    </div>
    <p id="login-error">Usuario o contraseña incorrectos.</p>
    <button class="btn btn-blue" onclick="doLogin()">Entrar</button>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("login-pass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });

    function doLogin() {
      var u = document.getElementById("login-user").value.trim().toLowerCase();
      var p = document.getElementById("login-pass").value;
      var err = document.getElementById("login-error");

      if (USUARIOS[u] && USUARIOS[u].pass === p) {
        err.style.display = "none";
        localStorage.setItem("nexora-user", u);
        localStorage.setItem("nexora-rol",  USUARIOS[u].rol);
        window.location.href = "routes/dashboard.html";
      } else {
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
